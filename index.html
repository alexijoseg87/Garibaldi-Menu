let syncing = false, lastSync;
async function updateMenu() {
  if (syncing) return;
  syncing = true;
  try {
    const response = await fetch('https://garibaldi-api.alexijoseg87.workers.dev/menu', {cache:'no-store', signal:AbortSignal.timeout(20000)});
    if (!response.ok) throw new Error('No se pudo actualizar');
    const data = await response.json();
